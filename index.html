<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hidden Objects</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-title"><span id="lvlNum">LEVEL 1</span><span id="lvlName"></span></div>
      <div class="hud-stats"><span id="timer">0:00</span><span id="count">0/0</span></div>
      <div class="hud-btns">
        <button id="hintBtn" class="btn">Hint</button>
        <button id="muteBtn" class="btn">Sound: on</button>
        <button id="menuBtn" class="btn">Menu</button>
      </div>
    </header>
    <div id="status" aria-live="polite">&nbsp;</div>
    <main id="stage">
      <div id="viewport"><canvas id="scene"></canvas></div>
    </main>
    <section id="list" aria-label="Objects to find"></section>
  </div>
  <div id="overlay" hidden><div class="card" id="card"></div></div>

  <script src="js/util.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
